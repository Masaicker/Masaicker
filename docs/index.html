      <main>
        <section class="hero" aria-labelledby="site-title"><div><p class="eyebrow">PLAYER-MADE ARCHIVE · 01</p><h1 id="site-title">MODS <span>&amp;</span> GAMES.</h1><p id="hero-copy" class="hero-copy"></p></div><aside class="hero-stat" aria-label="项目统计"><div class="stat-line"><strong id="game-count" class="stat-number">00</strong><span class="stat-label">GAMES</span></div><div class="stat-line"><strong id="mod-count" class="stat-number">00</strong><span class="stat-label">MODS</span></div><button id="avatar-deck" class="avatar-deck hero-avatar-deck" type="button" aria-label="切换到下一张展示头像" title="点击切换头像"></button></aside></section>
